name: HTML to APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          # အလိုအလျောက် ပရောဂျက်ဆောက်ပြီး APK ထုတ်မည့် အပိုင်း
          yes | bubblewrap init --manifest=https://kingeraser408-cmyk.github.io/my-html-app/manifest.json || true
          # မှတ်ချက် - ဒီအဆင့်က manifest လိုအပ်နိုင်ပါတယ်
          
      - name: Alternative Simple Build
        run: |
          # တကယ်လို့ အပေါ်ကနည်းလမ်းခက်ခဲရင် Android Studio မလိုဘဲ build မည့် အခြားနည်းလမ်း
          echo "Building simple webview app..."
          # သင့် HTML များကို APK အဖြစ်ပြောင်းရန် အောက်ပါ tool ကို တိုက်ရိုက်သုံးပါမည်
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-APK
          path: ./*.apk
          
