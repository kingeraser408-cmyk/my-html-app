name: HTML to APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Version update လုပ်ထားသည်

      - name: Web to APK Action
        uses: jasonit/web-to-app-action@main # ပိုကောင်းတဲ့ action ပြောင်းထားသည်
        with:
          app-name: "MyAwesomeApp"
          source-directory: "." # index.html ရှိတဲ့နေရာ

      - name: Upload APK
        uses: actions/upload-artifact@v4 # v2 အစား v4 ပြောင်းထားသည်
        with:
          name: my-app-apk
          path: ./*.apk
          
