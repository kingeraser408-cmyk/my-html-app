name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          # အောက်ပါ command သည် APK ထွက်စေရန် အဓိကလုပ်ဆောင်ပါလိမ့်မည်
          bubblewrap build || echo "Build process finished"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/*.apk" # ဖိုင်လမ်းကြောင်းကို ရှာဖွေခိုင်းလိုက်တာပါ
          if-no-files-found: error
          
