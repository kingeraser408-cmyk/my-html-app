name: HTML to APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Project Structure
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r ./* android/app/src/main/assets/www/ || true
          # Remove .github folder from assets to save space
          rm -rf android/app/src/main/assets/www/.github

      - name: Build with Bubblewrap (Web-to-APK)
        uses: jasonit/web-to-app-action@main
        with:
          app-name: "MyHtmlApp"
          source-directory: "."
          # အရင်က error တက်ခဲ့တဲ့ tool မဟုတ်ဘဲ version အသစ်ကို ခေါ်သုံးထားပါတယ်
          
