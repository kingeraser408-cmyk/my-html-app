name: HTML to APK (Final Success)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Version 21 သို့ မြှင့်တင်ထားသည်
          distribution: 'temurin'

      - name: Prepare Folder and Install Tools
        run: |
          mkdir -p www
          cp -r ./* www/ || true
          rm -rf www/.github
          npm install -g @ionic/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize and Build Android
        run: |
          npx cap init MyApp com.kingeraser.myapp --web-dir www
          npx cap add android
          # Java Version ပြဿနာအတွက် Environment Variable ထည့်သွင်းခြင်း
          export JAVA_HOME=$JAVA_HOME_21_X64
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Export APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./my-final-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-HTML-App-APK
          path: my-final-app.apk
          
