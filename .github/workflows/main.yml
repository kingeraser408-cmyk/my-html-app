name: HTML to APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK
        uses: elvis-perez/web-to-app-action@v1.1
        with:
          name: "MyAwesomeApp"
          url: "file:///android_asset/www/index.html"
          folder: "."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: ./*.apk
          
