name: HTML to APK (Final Fix)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Ionic and Capacitor
        run: |
          npm install -g @ionic/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Project ကို အခြေခံမှ စဆောက်ခြင်း
          npx cap init MyApp com.kingeraser.myapp --web-dir .
          npx cap add android

      - name: Build Android
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Find and Export APK
        run: |
          # ထွက်လာတဲ့ APK ကို အပြင်ကို ထုတ်ပေးခြင်း
          cp android/app/build/outputs/apk/debug/app-debug.apk ./my-final-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-HTML-App-APK
          path: my-final-app.apk
          
