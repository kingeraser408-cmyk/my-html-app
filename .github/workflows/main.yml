name: HTML to APK Final
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Tool
        run: npm install -g @bubblewrap/cli

      - name: Generate APK (Silently)
        run: |
          # Manifest မရှိရင် အလိုအလျောက် အခြေခံတစ်ခု ဆောက်ပေးပါမယ်
          echo '{"name":"My App","short_name":"MyApp","start_url":"/index.html","display":"standalone","background_color":"#fff","theme_color":"#fff","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}' > manifest.json
          
          # Bubblewrap ကို မေးခွန်းမမေးဘဲ build ခိုင်းခြင်း
          bubblewrap init --manifest manifest.json --no-prompt || true
          bubblewrap build --skipConfig --no-prompt || echo "Skipping build error for now"
          
          # APK ဖိုင် တကယ်ထွက်မထွက် စစ်ဆေးပြီး အပြင်ကို ထုတ်ပေးခြင်း
          find . -name "*.apk" -exec cp {} ./app-release.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-APK
          path: app-release.apk
          if-no-files-found: error
          
