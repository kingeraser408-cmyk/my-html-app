name: HTML to APK (Success Version)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Folder and Install Tools
        run: |
          # www folder ဆောက်ပြီး HTML project ဖိုင်များကို ရွှေ့ခြင်း
          mkdir www
          cp -r ./* www/ || true
          # မလိုအပ်သော workflows folder ကို ပြန်ဖျက်ခြင်း
          rm -rf www/.github
          
          npm install -g @ionic/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize and Build Android
        run: |
          # web-dir ကို www လို့ သတ်မှတ်လိုက်ခြင်းဖြင့် error ကို ဖြေရှင်းသည်
          npx cap init MyApp com.kingeraser.myapp --web-dir www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Export APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./my-final-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-HTML-App-APK
          path: my-final-app.apk
          
